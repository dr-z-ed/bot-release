name: Validate source release request

on:
  repository_dispatch:
    types:
      - drzed-release-requested

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.client_payload.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
      SOURCE_SHA: ${{ github.event.client_payload.sha }}
      RELEASE_TAG: ${{ github.event.client_payload.tag }}
      SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
    steps:
      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${SOURCE_REPOSITORY}" != "faraz-shamim/drzed-rust" ]]; then
            echo "Unexpected source repository" >&2
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag" >&2
            exit 1
          fi
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source commit SHA" >&2
            exit 1
          fi
          TAG_OBJECT_TYPE="$(gh api "/repos/${SOURCE_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.type')"
          TAG_OBJECT_SHA="$(gh api "/repos/${SOURCE_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          if [[ "${TAG_OBJECT_TYPE}" != "tag" ]]; then
            echo "Release tag must be an annotated signed tag" >&2
            exit 1
          fi
          VERIFIED="$(gh api "/repos/${SOURCE_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" --jq '.verification.verified')"
          TAGGED_SHA="$(gh api "/repos/${SOURCE_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" --jq '.object.sha')"
          if [[ "${VERIFIED}" != "true" || "${TAGGED_SHA}" != "${SOURCE_SHA}" ]]; then
            echo "Signed tag verification or source SHA comparison failed" >&2
            exit 1
          fi
          {
            echo "### Validated Dr. Zed release request"
            echo "- Source: ${SOURCE_REPOSITORY}"
            echo "- Tag: ${RELEASE_TAG}"
            echo "- Commit: ${SOURCE_SHA}"
            echo "- Source workflow run: ${SOURCE_RUN_ID}"
            echo "- Phase 0 only validates the handoff; it does not publish an asset."
          } >> "${GITHUB_STEP_SUMMARY}"
