name: Verify published release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to re-verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify installer and checksum
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      RELEASE_REPOSITORY: dr-z-ed/bot-release
    steps:
      - name: Download the exact public inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          ASSET_NAME="dr-zed-setup-${RELEASE_TAG}.exe"
          mkdir release-inputs
          gh release download "${RELEASE_TAG}" --repo "${RELEASE_REPOSITORY}" \
            --dir release-inputs --pattern "${ASSET_NAME}" --pattern "${ASSET_NAME}.sha256"
          test "$(find release-inputs -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Verify installer checksum and format
        shell: bash
        run: |
          set -euo pipefail
          ASSET_NAME="dr-zed-setup-${RELEASE_TAG}.exe"
          (cd release-inputs && sha256sum --check "${ASSET_NAME}.sha256")
          test "$(head -c 2 "release-inputs/${ASSET_NAME}")" = 'MZ'
          echo "Verified ${ASSET_NAME} and its SHA-256 checksum." >> "${GITHUB_STEP_SUMMARY}"
